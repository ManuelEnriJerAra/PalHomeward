name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "true"

jobs:
  offline-tests:
    # CI never runs Palworld and does not count as integration evidence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y lua5.4
      - run: pip install -r requirements-dev.txt
      - run: python tools/check_lua_syntax.py
      - run: python tools/validate_package.py
      - run: python -m pytest -q
